<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<title>Your result — The Chaos Club</title>
<style>
:root{--carbon-950:#0B0E12;--carbon-900:#12161C;--carbon-850:#171C24;--carbon-800:#1D232C;--line:#2B3440;
 --white:#FFF;--silver:#CFD6DE;--muted:#8B96A3;--race-red:#E10600;--t-fastest:#B23BEE;--t-personal:#00A94F;
 --cond:"Barlow Condensed","Roboto Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(120% 60% at 50% 0%,#161C25 0%,var(--carbon-950) 60%) no-repeat,var(--carbon-950);
 color:var(--white);font-family:var(--ui);font-variant-numeric:tabular-nums;
 padding:26px 16px 44px;max-width:640px;margin:0 auto;min-height:100vh}

header{display:flex;align-items:center;gap:16px}
header .bar{width:4px;height:58px;background:var(--race-red);box-shadow:0 0 12px rgba(225,6,0,.5);flex:0 0 auto}
header .emb{height:56px;width:auto}
header .word{height:30px;width:auto;margin-bottom:2px}
.rule{height:3px;margin:16px 0 0;background:linear-gradient(90deg,var(--race-red) 0 92px,var(--line) 92px)}
.ses{margin:14px 0 20px;font-size:11px;letter-spacing:.24em;color:var(--muted);font-weight:700}

/* ---------- podium hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid #232B35;
 background:linear-gradient(160deg,#1A212B 0%,#12161C 55%,#0E1218 100%);padding:22px 20px 20px;margin-bottom:10px}
.hero .wm{position:absolute;right:-70px;bottom:-40px;width:330px;opacity:.13;pointer-events:none}
.hero .lab{position:relative;font-family:var(--cond);font-size:16px;letter-spacing:.32em;color:var(--race-red);font-weight:600}
.hero .top{position:relative;display:flex;align-items:flex-end;gap:14px;margin-top:12px}
.hero .p1{font-family:var(--cond);font-size:86px;line-height:.82;font-weight:700}
.hero .nm{font-family:var(--cond);font-size:44px;line-height:1;font-weight:600;letter-spacing:.01em;padding-bottom:4px}
.hero .meta{position:relative;display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap}
.hero .bl{font-family:var(--cond);font-size:34px;font-weight:600;color:var(--t-fastest);line-height:1}
.hero .bll{font-size:10px;letter-spacing:.22em;color:var(--muted);font-weight:700}
.plate{display:inline-flex;align-items:center;flex:0 0 auto}
.plate i{width:4px;align-self:stretch;background:var(--race-red);border-radius:3px 0 0 3px;font-style:normal}
.plate b{background:linear-gradient(180deg,#EDF1F5,#C4CBD3);color:#0D1116;font-family:var(--cond);font-weight:700;
 padding:1px 10px 3px;border-radius:0 5px 5px 0;font-size:24px;line-height:1.15}
.pods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.pod{background:var(--carbon-900);border:1px solid #1A2029;border-radius:14px;padding:13px 14px;display:flex;align-items:center;gap:11px}
.pod .p{font-family:var(--cond);font-size:30px;color:var(--muted);font-weight:600;line-height:1}
.pod .n{font-family:var(--cond);font-size:23px;font-weight:600;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .s{font-size:10px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-top:2px}

/* ---------- board ---------- */
.hint{font-size:11px;letter-spacing:.24em;color:var(--muted);font-weight:700;margin-bottom:10px}
.row{display:grid;grid-template-columns:30px 50px 1fr auto;gap:11px;align-items:center;
 padding:13px 12px;border-radius:12px;background:var(--carbon-900);border:1px solid #1A2029;margin-bottom:7px;cursor:pointer;
 transition:border-color .15s,background .15s}
.row.on{border-color:var(--race-red);background:linear-gradient(90deg,rgba(225,6,0,.16),var(--carbon-900) 72%)}
.row .pos{font-family:var(--cond);font-size:27px;font-weight:600;line-height:1}
.row .nm{font-family:var(--cond);font-size:22px;font-weight:600;line-height:1.1}
.row .sub{font-size:10px;letter-spacing:.14em;color:var(--muted);font-weight:700;margin-top:1px}
.row .bt{font-family:var(--cond);font-size:24px;font-weight:600;text-align:right}
.row .plate b{font-size:19px;padding:1px 8px 2px}
.fast{color:var(--t-fastest)}

/* ---------- personal card ---------- */
.card{position:relative;overflow:hidden;margin-top:22px;border-radius:18px;border:1px solid #2C3440;
 background:linear-gradient(160deg,#1B222C 0%,#12161C 60%);padding:24px 20px 22px;display:none}
.card.on{display:block}
.card .wm{position:absolute;right:-80px;top:-30px;width:360px;opacity:.10;pointer-events:none}
.card .who{position:relative;font-size:10px;letter-spacing:.26em;color:var(--race-red);font-weight:800}
.card .big{position:relative;font-family:var(--cond);font-size:64px;line-height:.92;font-weight:700;margin-top:8px}
.card .sub2{position:relative;display:flex;align-items:center;gap:12px;margin-top:12px}
.stats{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:20px;
 border-top:1px solid var(--line);padding-top:18px}
.stats span{display:block;font-size:9px;letter-spacing:.22em;color:var(--muted);font-weight:800;margin-bottom:4px}
.stats b{font-family:var(--cond);font-size:32px;font-weight:600;line-height:1}
.btns{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
button{font-family:var(--ui);font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--white);cursor:pointer;
 background:linear-gradient(180deg,#2B323C,#1B212A);border:1px solid #0C0F14;border-radius:11px;padding:16px 8px;
 box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #0B0E12}
button.primary{background:linear-gradient(180deg,#E8342E,#A50400);border-color:#5C0200;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 3px 0 #4C0200}
button:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
 align-items:center;font-size:10px;letter-spacing:.20em;color:var(--muted);font-weight:700}
footer b{color:var(--white);font-weight:800;font-size:11px;letter-spacing:.22em}
.keep{margin-top:22px;padding:14px 16px;border-left:2px solid var(--race-red);background:rgba(225,6,0,.05);
 border-radius:0 10px 10px 0;font-size:12px;line-height:1.65;color:var(--muted);letter-spacing:.01em}
.err{padding:30px 0;color:var(--muted);font-size:14px;line-height:1.7}
canvas{display:none}
</style></head>
