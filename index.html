/* This page is served on its own from a public host, so it carries its own copy of the KartViz palette. */
:root{--carbon-950:#0B0E12;--carbon-900:#12161C;--carbon-850:#171C24;--carbon-800:#1D232C;--carbon-750:#232B35;
 --line:#2B3440;--line-soft:#1A2029;--white:#FFF;--silver:#CFD6DE;--muted:#8B96A3;--race-red:#E10600;--chrome:#D8DEE6;
 --plate-hi:#EDF1F5;--plate-lo:#C4CBD3;--plate-ink:#0D1116;--t-fastest:#B23BEE;
 --ease-out-strong:cubic-bezier(.23,1,.32,1);
 --cond:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-anchor:none;
 scrollbar-color:var(--line) var(--carbon-900);scrollbar-width:thin}
body{background:radial-gradient(120% 60% at 50% 0%,#161C25 0%,var(--carbon-950) 60%) no-repeat,var(--carbon-950);
 color:var(--white);font-family:var(--ui);font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;
 display:flex;flex-direction:column;max-width:640px;margin:0 auto;min-height:100vh;min-height:100svh;overflow-anchor:none;
 padding:calc(24px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px))
  calc(36px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
::selection{background:#7A1E1B;color:var(--white)}
:focus-visible{outline:3px solid var(--chrome);outline-offset:2px}
.btn.primary:focus-visible{outline-color:var(--white)}
button{font:inherit;color:inherit}
.fast{color:var(--t-fastest)}

/* ---------- the venue lockup and its rule ---------- */
.mark{display:flex;align-items:center;gap:14px}
.mark .bar{width:4px;height:50px;background:var(--race-red);border-radius:1px;flex:0 0 auto}
.mark .emb{height:56px;width:auto}
.mark .word{height:30px;width:auto;margin-bottom:2px}
.rule{height:3px;margin-top:16px;border-radius:2px;background:linear-gradient(90deg,var(--race-red) 0 92px,var(--line) 92px)}
#app{flex:1 0 auto}

/* ---------- session line ---------- */
.ses{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:18px 0 16px}
.ses .sn{min-width:0;font:600 20px/1.15 var(--cond);letter-spacing:.04em;text-transform:uppercase;color:var(--silver);overflow-wrap:anywhere}
.ses time{flex:0 0 auto;font-size:14px;color:var(--muted);white-space:nowrap}

/* ---------- the kart plate: chrome face, red edge ---------- */
.plate{display:inline-flex;align-items:stretch;flex:0 0 auto}
.plate i{width:4px;background:var(--race-red);border-radius:3px 0 0 3px}
.plate b{background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));color:var(--plate-ink);font:700 24px/1.15 var(--cond);
 padding:1px 10px 3px;border-radius:0 5px 5px 0;box-shadow:inset 0 1px 0 var(--white),0 2px 6px rgba(11,14,18,.35)}
.plate--sm i{width:3px}
.plate--sm b{font-size:20px;padding:1px 8px 2px}
.plate--xs i{width:3px}
.plate--xs b{font-size:16px;padding:0 6px 1px;border-radius:0 4px 4px 0}

/* ---------- the winner ---------- */
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid var(--carbon-750);padding:22px 20px 20px;
 background:linear-gradient(160deg,#1A212B 0%,var(--carbon-900) 55%,#0E1218 100%);box-shadow:0 12px 28px -14px rgba(0,0,0,.7)}
.wm{position:absolute;pointer-events:none;user-select:none}
.hero .wm{right:-70px;bottom:-40px;width:330px;opacity:.13}
.hero .top{position:relative;display:flex;align-items:flex-end;gap:14px}
.hero .p1{flex:0 0 auto;font:700 86px/.8 var(--cond)}
.hero .nmw{flex:1 1 0;min-width:0;container-type:inline-size;padding-bottom:3px}
.hero .nm{display:block;font:600 44px/1 var(--cond);font-size:clamp(22px,calc(100cqi / (var(--w,8) * .5)),44px);
 letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.hero .meta{position:relative;display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 20px;margin-top:20px}
.hero .st{display:flex;flex-direction:column;gap:5px}
.hero .bll{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hero .bl{font:600 34px/1 var(--cond)}
.hero .bl.fast{color:var(--t-fastest)}

/* ---------- second and third ---------- */
.pods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pod{min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
 background:var(--carbon-900);border:1px solid var(--line-soft)}
.pod:last-child:nth-child(odd){grid-column:1 / -1}
.pod .p{flex:0 0 auto;font:600 30px/1 var(--cond);color:var(--muted)}
.pod .pb{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;container-type:inline-size}
/* a long name steps down until its longest word fits the box, then takes a second line; never cut */
.pod .n{font:600 22px/1.05 var(--cond);font-size:clamp(14px,calc(100cqi / (var(--w,8) * .5)),22px);letter-spacing:.01em;
 text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.pod .s{display:flex;align-items:center;gap:8px}
.pod .t{font:700 20px/1 var(--cond);color:var(--silver)}
.pod .t.fast{color:var(--t-fastest)}
.dh{display:inline-flex;align-items:center;flex:0 0 auto;min-height:22px;padding:2px 9px;border-radius:20px;
 border:1px solid var(--line);background:var(--carbon-850);font:800 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;
 color:var(--silver);white-space:nowrap}
.pod .dh{align-self:flex-start}
.hero .meta .dh{align-self:flex-end;margin-bottom:4px}

/* ---------- the finishing order: one button per driver ---------- */
.hint{margin:26px 0 10px;font-size:14px;color:var(--silver);text-wrap:pretty}
.board{list-style:none;display:flex;flex-direction:column;gap:8px}
.row{width:100%;min-height:64px;display:grid;grid-template-columns:30px minmax(40px,auto) minmax(0,1fr) auto;align-items:center;gap:12px;
 padding:10px 14px 10px 10px;border-radius:12px;background:var(--carbon-900);border:1px solid var(--line-soft);text-align:left;
 cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
 transition:transform 100ms var(--ease-out-strong),background-color 160ms var(--ease-out-strong),border-color 160ms var(--ease-out-strong)}
.row:active{background:var(--carbon-800);transform:scale(.985)}
.row.on{border-color:var(--race-red);background:linear-gradient(90deg,rgba(225,6,0,.16),var(--carbon-900) 72%)}
.row .pos{font:600 27px/1 var(--cond);text-align:center}
.row .who{min-width:0;display:flex;flex-direction:column;gap:4px;container-type:inline-size}
.row .nm{font:600 24px/1.05 var(--cond);font-size:clamp(16px,calc(100cqi / (var(--w,8) * .5)),24px);letter-spacing:.01em;
 text-transform:uppercase;overflow-wrap:anywhere}
.row .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted)}
.row .bt{font:600 26px/1 var(--cond);text-align:right}
@media (hover:hover) and (pointer:fine){
 .row:hover{background:var(--carbon-850);border-color:var(--line)}
 .row.on:hover{border-color:var(--race-red)}
 .btn:hover{filter:brightness(1.06)}
}

/* ---------- your lap card: opens under your row ---------- */
.card{position:relative;overflow:hidden;margin-top:8px;border-radius:18px;border:1px solid var(--line);padding:22px 20px 20px;
 background:linear-gradient(160deg,#1B222C 0%,var(--carbon-900) 60%);box-shadow:0 14px 32px -16px rgba(0,0,0,.75);
 container-type:inline-size}
.card.on{animation:rise 280ms var(--ease-out-strong) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.card .wm{right:-80px;top:-30px;width:360px;opacity:.10}
.card .big{position:relative;display:flex;flex-direction:column;font:700 64px/.92 var(--cond);text-transform:uppercase}
.card .cn{font-weight:600;font-size:clamp(22px,calc(100cqi / (var(--w,8) * .5)),64px);letter-spacing:.01em;
 overflow-wrap:anywhere;text-wrap:balance}
.card .sub2{position:relative;display:flex;align-items:center;gap:12px;margin-top:16px}
.card .lp{font-size:15px;font-weight:600;color:var(--silver)}
.stats{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.stats dt{margin-bottom:6px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats b{font:600 34px/1 var(--cond)}
/* side by side while both labels fit on one line; otherwise each button takes the full width */
.btns{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{flex:1 1 0;min-width:max-content;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:12px;border-radius:11px;
 font:700 15px/1.1 var(--ui);letter-spacing:.10em;text-transform:uppercase;color:var(--white);cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;
 background:linear-gradient(180deg,#2B323C,#1B212A);border:1px solid #0C0F14;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 3px 0 #0B0E12;
 transition:transform 100ms var(--ease-out-strong),box-shadow 100ms var(--ease-out-strong)}
.btn.primary{background:linear-gradient(180deg,#E8342E,#A50400);border-color:#5C0200;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 3px 0 #4C0200}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 transparent}
.btn[aria-busy="true"]{cursor:progress}
.ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn span{white-space:nowrap}
.card .note{position:relative;display:flex;align-items:flex-start;gap:8px;margin-top:14px;font-size:14px;line-height:1.4;color:var(--silver);text-wrap:pretty}
.card .note .ico{width:18px;height:18px;margin-top:1px;color:var(--race-red)}

/* ---------- a link that holds no result we can show ---------- */
.err{position:relative;overflow:hidden;margin-top:24px;border-radius:18px;border:1px solid var(--carbon-750);padding:26px 22px 28px;
 background:linear-gradient(160deg,#1A212B 0%,var(--carbon-900) 60%)}
.err .wm{right:-90px;bottom:-60px;width:300px;opacity:.08}
.err h1{position:relative;font:600 28px/1.1 var(--cond);letter-spacing:.01em;text-wrap:balance}
.err p{position:relative;max-width:34ch;margin-top:10px;font-size:16px;line-height:1.5;color:var(--silver);text-wrap:balance}

/* ---------- the share card, drawn off screen; ?showcard=1 shows it ---------- */
canvas{display:none}
canvas.show{display:block;width:100%;height:auto;margin-top:22px;border-radius:14px;box-shadow:0 14px 32px -16px rgba(0,0,0,.75)}

footer{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:32px;padding-top:16px;
 border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer b{font-size:13px;font-weight:800;letter-spacing:.22em;color:var(--white)}

/* the font shorthand resets the numerals: times, positions and plates stay tabular so the decimals line up */
.plate b,.hero .p1,.hero .bl,.pod .p,.pod .t,.row .pos,.row .bt,.card .big,.stats b{font-variant-numeric:tabular-nums lining-nums}

@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
}
</style></head>

var SUPPORTED=['1'];
function parse(){

  var p=h.split('|');

  if(p[0]!=='1'||p.length<4) return null;
  var ses=p[1], d=p[2], rest=h.slice(h.indexOf(d)+d.length+1);
  var rows=rest.split(';').map(function(r){var f=r.split('|');
    return{name:f[0],kart:+f[1],pos:+f[2],laps:+f[3],best:+f[4],avg:+f[5],total:+f[6]};})
    .filter(function(r){return r.name&&!isNaN(r.pos)});
  if(!rows.length) return null;
  return {session:ses,date:d.slice(4,6)+'/'+d.slice(2,4)+'/20'+d.slice(0,2),rows:rows.sort(function(a,b){return a.pos-b.pos})};

  var d=+m[1], mo=+m[2], y=+m[3], dt=new Date(Date.UTC(y,mo-1,d));
  if(dt.getUTCMonth()!==mo-1||dt.getUTCDate()!==d) return null;
  return {day:DAYS[dt.getUTCDay()], date:d+' '+MONTHS[mo-1]+' '+y, iso:m[3]+'-'+m[2]+'-'+m[1]};
}
function fastest(rows){var b=rows.map(function(r){return r.best}).filter(fin);return b.length?Math.min.apply(null,b):null;}
/* the longest word of a name, so the big name steps down until that word fits its line */
function wlen(n){return Math.max(4,Math.max.apply(null,String(n).split(/\s+/).map(function(w){return w.length})));}
function slug(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function fileName(r){return 'chaosclub-'+(slug(S.session)||'session')+'-'+(slug(r.name)||'kart-'+p2(r.kart))+'.png';}
function plate(k,cls){return '<span class="plate'+(cls||'')+'"><i></i><b>'+p2(k)+'</b></span>';}
/* the positions the engine gave to more than one kart: a dead heat, shown as the boards show it */
function ties(rows){var n={},t={};rows.forEach(function(r){n[r.pos]=(n[r.pos]||0)+1;});Object.keys(n).forEach(function(p){if(n[p]>1)t[p]=true;});return t;}
var DH='<span class="dh">Dead heat</span>';
function stat(label,value,cls){return '<div class="st"><span class="bll">'+label+'</span><span class="bl'+(cls?' '+cls:'')+'">'+value+'</span></div>';}
function message(title,line){
  return '<section class="err"><img class="wm" src="'+TRACK+'" alt=""><h1>'+title+'</h1><p>'+line+'</p></section>';
}

function render(){
  try{ S=parse(); }catch(e){ S=null; }            /* a link cut in the middle of a character cannot be decoded: no result */
  Object.keys(CACHE).forEach(function(k){ if(CACHE[k].url) URL.revokeObjectURL(CACHE[k].url); }); CACHE={};
  $('#cv').classList.remove('show'); $('#app').hidden=false;
  if(S&&S.unsupported){ $('#app').innerHTML=message('We can’t open this result here','Please ask at the desk and we’ll find it for you.'); return; }
  if(!S){ $('#app').innerHTML=message('No result in this link','Scan the code on the results screen after your race.'); return; }
  var fast=fastest(S.rows), w=S.rows[0], W=when(S.date), T=ties(S.rows);
  var pods=S.rows.slice(1).filter(function(r){return r.pos<=3;}).slice(0,4);   /* as the results board: a tie for a place lists every kart in it */
  var h='<div class="ses"><h1 class="sn">'+esc(S.session)+'</h1>'+
        (W?'<time datetime="'+W.iso+'">'+W.day+' '+W.date+'</time>':'')+'</div>';
  h+='<section class="hero" aria-label="Winner"><img class="wm" src="'+TRACK+'" alt="">'+
     '<div class="top"><span class="p1">'+num(w.pos)+'</span>'+
     '<span class="nmw"><span class="nm" style="--w:'+wlen(w.name)+'">'+esc(w.name)+'</span></span></div>'+
     '<div class="meta">'+plate(w.kart)+stat('Best lap',t2(w.best),w.best===fast?'fast':'')+
     stat('Laps',num(w.laps))+stat('Total time',mmss(w.total))+(T[w.pos]?DH:'')+'</div></section>';
  if(pods.length){
    h+='<div class="pods">'+pods.map(function(r){
      return '<div class="pod"><span class="p">'+num(r.pos)+'</span><span class="pb"><span class="n" style="--w:'+wlen(r.name)+'">'+esc(r.name)+'</span>'+
             '<span class="s">'+plate(r.kart,' plate--xs')+'<span class="t'+(r.best===fast?' fast':'')+'">'+t2(r.best)+'</span></span>'+(T[r.pos]?DH:'')+'</span></div>';
    }).join('')+'</div>';
  }
  h+='<p class="hint">Tap your name for your lap card</p><ol class="board" aria-label="Finishing order">';
  S.rows.forEach(function(r,i){
    var label='P'+num(r.pos)+(T[r.pos]?', dead heat':'')+', '+r.name+', Kart '+p2(r.kart)+', '+lapsTxt(r.laps)+', best lap '+t2(r.best);
    h+='<li><button type="button" class="row" data-i="'+i+'" aria-expanded="false" aria-controls="card" aria-label="'+esc(label)+'">'+
       '<span class="pos">'+num(r.pos)+'</span>'+plate(r.kart,' plate--sm')+
       '<span class="who"><span class="nm" style="--w:'+wlen(r.name)+'">'+esc(r.name)+'</span><span class="sub"><span>'+lapsTxt(r.laps)+' · avg '+t2(r.avg)+'</span>'+(T[r.pos]?DH:'')+'</span></span>'+
       '<span class="bt'+(r.best===fast?' fast':'')+'">'+t2(r.best)+'</span></button></li>';
  });
  h+='</ol><section class="card" id="card" hidden></section>';
  $('#app').innerHTML=h;
  [].forEach.call(document.querySelectorAll('.row'),function(el){el.addEventListener('click',function(){openCard(+el.dataset.i);});});
}

/* Tapping a row opens ITS card right under it; tapping it again closes it. */
function openCard(i){
  var card=$('#card'), rows=document.querySelectorAll('.row'), row=rows[i], r=S&&S.rows[i];
  if(!card||!row||!r) return;
  var closing=!card.hidden&&card.dataset.i===String(i), top=row.getBoundingClientRect().top;
  [].forEach.call(rows,function(e){ var on=!closing&&e===row; e.classList.toggle('on',on); e.setAttribute('aria-expanded',on?'true':'false'); });
  if(closing){ card.hidden=true; card.classList.remove('on'); card.removeAttribute('data-i'); hold(row,top); return; }
  var fast=fastest(S.rows);
  card.setAttribute('aria-label','Lap card, '+r.name);
  card.innerHTML='<img class="wm" src="'+TRACK+'" alt="">'+
    '<h2 class="big"><span class="cp">P'+num(r.pos)+'</span> <span class="cn" style="--w:'+wlen(r.name)+'">'+esc(r.name)+'</span></h2>'+
    '<div class="sub2">'+plate(r.kart)+'<span class="lp">'+lapsTxt(r.laps)+'</span>'+(ties(S.rows)[r.pos]?DH:'')+'</div>'+
    '<dl class="stats">'+
    '<div><dt>Best lap</dt><dd><b'+(r.best===fast?' class="fast"':'')+'>'+t2(r.best)+'</b></dd></div>'+
    '<div><dt>Average lap</dt><dd><b>'+t2(r.avg)+'</b></dd></div>'+
    '<div><dt>Total time</dt><dd><b>'+mmss(r.total)+'</b></dd></div>'+
    '<div><dt>Position</dt><dd><b>'+num(r.pos)+'</b></dd></div>'+
    '</dl><div class="btns">'+
    '<button type="button" class="btn primary" id="dl">'+ICON_SAVE+'<span>Save image</span></button>'+
    '<button type="button" class="btn" id="sh">'+ICON_SHARE+'<span>Share</span></button></div>'+
    '<p class="note" id="note" role="status" hidden>'+ICON_ALERT+'<span></span></p>';
  card.classList.remove('on'); card.hidden=true;
  row.parentNode.appendChild(card);
  card.dataset.i=String(i); card.hidden=false; card.classList.add('on');
  hold(row,top); reveal(row,card);
  $('#dl').onclick=function(){ act(i,this,'Saving…',save); };
  $('#sh').onclick=function(){ act(i,this,'Sharing…',share); };
  setTimeout(function(){ if(S&&S.rows[i]===r) prepare(i); },320);   /* after the card has risen: a tap on Save is then instant */
}
/* a card closing above the tapped row would pull the row away from the finger: hold the row where it was */
function hold(row,top){ var d=row.getBoundingClientRect().top-top; if(Math.abs(d)>1) window.scrollBy(0,d); }
/* bring the card into view without pushing its row off the top */
function reveal(row,card){
  var vh=window.innerHeight, rt=row.getBoundingClientRect().top, cb=card.getBoundingClientRect().bottom, dy=0;
  if(rt<8) dy=rt-8; else if(cb+16>vh) dy=Math.min(cb+16-vh,rt-8);
  if(dy) window.scrollBy({top:dy,behavior:RM.matches?'auto':'smooth'});
}
document.addEventListener('keydown',function(e){
  var card=$('#card'); if(e.key!=='Escape'||!card||card.hidden) return;
  var i=+card.dataset.i, row=document.querySelectorAll('.row')[i]; openCard(i); if(row) row.focus();
});

/* ---------- the share card ---------- */
function ready(){
  if(!FONTS){
    var f=document.fonts, waits=[IMG.track,IMG.emb,IMG.word].map(function(im){return im&&im.decode?im.decode():null;});
    if(f&&f.load) waits.push(f.load('700 100px "Barlow Condensed"'),f.load('600 26px "Barlow Condensed"'));
    FONTS=Promise.all(waits.map(function(p){return Promise.resolve(p).catch(function(){});}));   /* a slow font never blocks saving */
  }
  return FONTS;
}
function prepare(i){
  if(CACHE[i]) return CACHE[i].p;
  var e={}, r=S.rows[i];
  e.p=ready().then(function(){return draw(r);}).then(function(b){e.blob=b;e.url=URL.createObjectURL(b);return e;});
  e.p.catch(function(){ delete CACHE[i]; });
  CACHE[i]=e; return e.p;
}
function act(i,btn,busy,fn){
  var e=CACHE[i], r=S.rows[i];
  note('');
  if(e&&e.url){ fn(e,r); return; }
  var label=btn.querySelector('span'), was=label.textContent;
  btn.setAttribute('aria-busy','true'); label.textContent=busy;
  prepare(i).then(function(c){fn(c,r);},function(){ note('We couldn’t make your image. Please try again.'); })
    .then(function(){btn.removeAttribute('aria-busy');label.textContent=was;});
}
/* one line under the buttons when the image could not be made; the next tap clears it */
function note(text){
  var n=$('#note'); if(!n) return;
  n.hidden=!text; n.querySelector('span').textContent=text;
}
function save(c,r){
  var a=document.createElement('a'); a.href=c.url; a.download=fileName(r);
  document.body.appendChild(a); a.click(); a.remove();
}
function share(c,r){
  var f=null; try{ f=new File([c.blob],fileName(r),{type:'image/png'}); }catch(err){}
  if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
    navigator.share({files:[f],title:'My lap times at The Chaos Club'}).catch(function(err){ if(!err||err.name!=='AbortError') save(c,r); });
  } else if(!window.open(c.url,'_blank')) save(c,r);
}
/* a rectangle path with its own radius per corner [top-left, top-right, bottom-right, bottom-left] */
function box(x,l,t,w,h,r){
  x.beginPath(); x.moveTo(l+r[0],t);
  x.arcTo(l+w,t,l+w,t+h,r[1]); x.arcTo(l+w,t+h,l,t+h,r[2]); x.arcTo(l,t+h,l,t,r[3]); x.arcTo(l,t,l+w,t,r[0]);
  x.closePath();
}
/* portrait share card, 1080x1350, drawn entirely on canvas: no libraries, no network */
function draw(r){
  var c=$('#cv'),x=c.getContext('2d'),W=1080,H=1350,fast=fastest(S.rows),D=when(S.date),
      CF='"Barlow Condensed","Arial Narrow",sans-serif', UI='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',
      sp=function(v){ if('letterSpacing' in x) x.letterSpacing=v; };
  x.clearRect(0,0,W,H); x.textAlign='left'; x.textBaseline='alphabetic'; sp('0px');
  var g=x.createLinearGradient(0,0,W*.4,H); g.addColorStop(0,'#1B222C');g.addColorStop(.55,'#0E1218');g.addColorStop(1,'#0B0E12');
  x.fillStyle=g; x.fillRect(0,0,W,H);
  if(IMG.track.naturalWidth){ x.save(); x.globalAlpha=.11;
    var tw=980, th=tw*IMG.track.naturalHeight/IMG.track.naturalWidth;
    x.drawImage(IMG.track,W-tw+150,H-th-120,tw,th); x.restore(); }
  /* the lockup */
  x.fillStyle='#E10600'; x.fillRect(74,96,6,92);
  if(IMG.emb&&IMG.emb.naturalWidth){ var eh=88, ew=eh*IMG.emb.naturalWidth/IMG.emb.naturalHeight;
    x.drawImage(IMG.emb,104,98,ew,eh);
    if(IMG.word&&IMG.word.naturalWidth){ var ww=300, wh=ww*IMG.word.naturalHeight/IMG.word.naturalWidth;
      x.drawImage(IMG.word,104+ew+22,98+eh-wh-6,ww,wh); } }
  /* session and date, then the red rule */
  x.font='600 30px '+CF; sp('1px');
  var dt=D?D.date.toUpperCase():'', room=W-152-(dt?x.measureText(dt).width+40:0), sn=S.session.toUpperCase();
  if(x.measureText(sn).width>room){ while(sn.length>1&&x.measureText(sn+'…').width>room) sn=sn.slice(0,-1); sn=sn.trim()+'…'; }
  x.fillStyle='#CFD6DE'; x.fillText(sn,76,238);
  if(dt){ x.fillStyle='#8B96A3'; x.textAlign='right'; x.fillText(dt,W-76,238); x.textAlign='left'; }
  sp('0px'); x.fillStyle='#E10600'; x.fillRect(74,268,W-148,4);
  /* position and name */
  x.fillStyle='#FFF'; x.font='700 230px '+CF; x.fillText('P'+num(r.pos),70,490);
  var nm=r.name.toUpperCase(), fs=100; x.font='600 '+fs+'px '+CF;
  while(x.measureText(nm).width>928&&fs>44){ fs-=2; x.font='600 '+fs+'px '+CF; }
  x.fillText(nm,76,610);
  /* kart plate and laps */
  var px=76,py=650,ph=64;
  x.font='700 52px '+CF; var k=p2(r.kart), nw=x.measureText(k).width+44;
  /* the chrome plate as the screens draw it: rounded red edge, rounded face, a white line along its top, a soft drop */
  x.fillStyle='#E10600'; box(x,px,py,7,ph,[6,0,0,6]); x.fill();
  var pg=x.createLinearGradient(0,py,0,py+ph); pg.addColorStop(0,'#EDF1F5');pg.addColorStop(1,'#C4CBD3');
  x.save(); x.shadowColor='rgba(11,14,18,.45)'; x.shadowOffsetY=4; x.shadowBlur=12;
  x.fillStyle=pg; box(x,px+7,py,nw,ph,[0,10,10,0]); x.fill(); x.restore();
  x.save(); box(x,px+7,py,nw,ph,[0,10,10,0]); x.clip(); x.fillStyle='rgba(255,255,255,.9)'; x.fillRect(px+7,py,nw,2); x.restore();
  x.fillStyle='#0D1116'; x.fillText(k,px+7+22,py+48);
  x.fillStyle='#CFD6DE'; x.font='700 28px '+UI; sp('2px'); x.fillText(lapsTxt(r.laps).toUpperCase(),px+nw+40,py+44); sp('0px');
  /* the four numbers */
  var st=[['BEST LAP',t2(r.best),r.best===fast?'#B23BEE':'#FFF'],['AVERAGE LAP',t2(r.avg),'#FFF'],
          ['TOTAL TIME',mmss(r.total),'#FFF'],['POSITION',num(r.pos),'#FFF']];
  st.forEach(function(s,i){ var cx=76+(i%2)*492, cy=850+Math.floor(i/2)*190;
    x.fillStyle='#2B3440'; x.fillRect(cx,cy-52,432,2);
    x.fillStyle='#8B96A3'; x.font='700 22px '+UI; sp('3px'); x.fillText(s[0],cx,cy); sp('0px');
    x.fillStyle=s[2]; x.font='600 92px '+CF; x.fillText(s[1],cx,cy+88);
    if(s[3]){ var vw=x.measureText(s[1]).width; x.fillStyle='#8B96A3'; x.font='600 44px '+CF; x.fillText(s[3],cx+vw+6,cy+88); } });
  /* the credit */
  x.fillStyle='#2B3440'; x.fillRect(74,H-124,W-148,2);
  x.fillStyle='#FFF'; x.font='800 26px '+UI; sp('5px'); x.fillText('KARTVIZ BY TURFVIZ',76,H-70); sp('0px');
  return new Promise(function(res,rej){ c.toBlob(function(b){ b?res(b):rej(new Error('no image')); },'image/png'); });
}

addEventListener('hashchange',render); render();
(function(){ if(!S||S.unsupported) return; var q=new URLSearchParams(location.search), m=q.get('me'); if(!m) return;
  for(var i=0;i<S.rows.length;i++) if(S.rows[i].name.toUpperCase()===m.toUpperCase()){ openCard(i);
    if(q.get('showcard')){ /* renders the share card on screen, to preview the artwork */
      var n=i; prepare(n).then(function(){ draw(S.rows[n]); $('#cv').classList.add('show'); $('#app').hidden=true; },function(){}); }
    break; } })();
</script>
</body></html>
