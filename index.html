/* This page is served on its own from a public host, so it carries its own copy of the KartViz palette (web/css/tokens.css).
   The only colour values in this file are here. */
:root{--carbon-950:#0B0E12;--carbon-900:#12161C;--carbon-850:#171C24;--carbon-800:#1D232C;--carbon-750:#232B35;
 --ink:#080A0D;--line:#2B3440;--line-soft:#1A2029;--white:#FFFFFF;--silver:#CFD6DE;--muted:#8B96A3;
 --race-red:#E10600;--chrome:#D8DEE6;--t-fastest:#B23BEE;--plate-hi:#EDF1F5;--plate-lo:#C4CBD3;--plate-ink:#0D1116;
 --glass-fill:rgba(15,19,25,.60);--glass-edge:rgba(255,255,255,.10);--glass-border:rgba(255,255,255,.055);
 --glass-blur:26px;--glass-sat:.55;--glass-bright:.70;--shadow-soft:rgba(0,0,0,.42);--bevel-hi:rgba(255,255,255,.14);
 --btn-face:linear-gradient(180deg,#2B323C 0%,#1B212A 100%);--btn-edge:#0C0F14;--btn-drop:#0B0E12;
 --btn-red-face:linear-gradient(180deg,#E8342E 0%,#A50400 100%);--btn-red-edge:#5C0200;--btn-red-drop:#4C0200;
 --ease-out-strong:cubic-bezier(.23,1,.32,1);--ease-drawer:cubic-bezier(.32,.72,0,1);--track-caps:.12em;
 --cond:"Barlow Condensed","Roboto Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
 --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --select-bg:color-mix(in srgb,var(--race-red) 40%,var(--carbon-800));
 /* text only: the lap-time purple and race red lifted so they read on carbon (7:1 for a time, 4.5:1 for a label);
    the pure tokens stay on the dots, rails, rules and buttons */
 --fast-ink:color-mix(in srgb,var(--t-fastest) 58%,var(--white));--red-ink:color-mix(in srgb,var(--race-red) 68%,var(--white))}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--carbon-950);
 scrollbar-color:var(--line) var(--carbon-900);scrollbar-width:thin}
html.lock{overflow:hidden}
body{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;color:var(--white);font-family:var(--ui);
 font-variant-numeric:tabular-nums lining-nums;-webkit-font-smoothing:antialiased;
 background:radial-gradient(140% 60% at 50% 0%,var(--carbon-800) 0%,var(--carbon-950) 62%) no-repeat,var(--carbon-950)}
::selection{background:var(--select-bg);color:var(--white)}
:focus-visible{outline:3px solid var(--chrome);outline-offset:2px}
.btn.primary:focus-visible{outline-color:var(--white)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
main{flex:1 0 auto}
.fast{color:var(--fast-ink)}
.ico{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chq{width:19px;height:12px;flex:0 0 auto;fill:currentColor}
.glass{background:var(--glass-fill);border:1px solid var(--glass-border);
 -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright));
 backdrop-filter:blur(var(--glass-blur)) saturate(var(--glass-sat)) brightness(var(--glass-bright))}

/* ---------- the header: the venue lockup left, the session right (sticky, 56 px) ---------- */
.top,.sbar{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top);border-width:0 0 1px}
.top .in,.sbar .in{height:55px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:9px;flex:0 0 auto}
.mark .bar{width:3px;height:30px;background:var(--race-red);border-radius:1px}
.mark .emb{height:36px;width:auto}
.mark .word{height:18px;width:auto}
.ses{min-width:0;display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right}
.ses .sn{max-width:100%;font:600 16px/1.1 var(--cond);letter-spacing:.05em;text-transform:uppercase;color:var(--silver);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses time{font-size:12px;line-height:1.2;color:var(--muted);white-space:nowrap}

/* ---------- the kart plate: chrome face, red edge ---------- */
.plate{display:inline-flex;align-items:stretch;flex:0 0 auto}
.plate i{width:4px;background:var(--race-red);border-radius:3px 0 0 3px}
.plate b{background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));color:var(--plate-ink);font:700 20px/1.1 var(--cond);padding:1px 8px 2px;
 border-radius:0 5px 5px 0;box-shadow:inset 0 1px 0 var(--white),0 2px 6px color-mix(in srgb,var(--carbon-950) 35%,transparent)}
.plate--xs i{width:3px}
.plate--xs b{font-size:16px;padding:0 6px 1px;border-radius:0 4px 4px 0}
.plate--lg i{width:6px;border-radius:4px 0 0 4px}
.plate--lg b{font-size:34px;padding:1px 12px 3px;border-radius:0 7px 7px 0}
.plate--xl i{width:7px;border-radius:5px 0 0 5px}
.plate--xl b{font-size:56px;line-height:1.02;padding:2px 13px 4px;border-radius:0 8px 8px 0}
.dh{display:inline-flex;align-items:center;flex:0 0 auto;min-height:20px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);
 background:var(--carbon-850);font:800 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--silver);white-space:nowrap}

/* ---------- the winner: a glass card over the track ---------- */
.wm{position:absolute;pointer-events:none;opacity:.14}
.wm path{fill:none;stroke:var(--white);stroke-width:1.6;vector-effect:non-scaling-stroke}
.wm .surf{fill:var(--white);fill-opacity:.3;fill-rule:evenodd;stroke:none}
.wm .sl{stroke-width:3}
.hero{position:relative;overflow:hidden;margin-top:16px;border-radius:18px;padding:18px 18px 16px;box-shadow:0 14px 34px -14px var(--shadow-soft)}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--glass-edge)}
.hero>.wm{right:-70px;top:-46px;width:300px}
/* the track fades out before the numbers, so no line runs behind a label */
.hero>.wm,.card>.wm{-webkit-mask-image:linear-gradient(180deg,var(--carbon-950) 45%,transparent 80%);mask-image:linear-gradient(180deg,var(--carbon-950) 45%,transparent 80%)}
.hero>:not(.wm){position:relative;z-index:1}
.eyebrow{display:flex;align-items:center;gap:8px;font:800 13px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--red-ink)}
.eyebrow .chq{color:var(--silver)}
.hero .who{display:flex;align-items:center;gap:14px;margin-top:14px}
.hero .nm{flex:1 1 0;min-width:0;font:800 32px/1.04 var(--cond);letter-spacing:.01em;text-transform:uppercase;overflow-wrap:anywhere;
 display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.hero .meta{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.st{display:flex;flex-direction:column;gap:7px}
.bll{font:700 12px/1 var(--ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--muted)}
.hero .bl{font:600 24px/1 var(--cond);color:var(--silver)}
.hero .best{margin-right:auto}
.blw{position:relative;display:inline-block}
.hero .best .bl,.blw .cu{font:700 40px/1 var(--cond);color:var(--white)}
.hero .best .bl.fast,.blw .fast~.cu{color:var(--fast-ink)}
.blw .cu{position:absolute;left:0;top:0;white-space:nowrap}
.counting .bl{opacity:0}

/* ---------- the podium: P2, P1, P3 ---------- */
.podium{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:8px;margin-top:20px}
.podium li{min-width:0;display:flex;flex-direction:column-reverse;gap:10px}
.podium .s1{grid-column:2;grid-row:1}.podium .s2{grid-column:1;grid-row:1}.podium .s3{grid-column:3;grid-row:1}
.pes{display:flex;flex-direction:column;gap:14px}
.pe{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.pe .n{max-width:100%;font:600 17px/1.08 var(--cond);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe .t{font:600 18px/1 var(--cond);color:var(--silver)}
.pe .t.fast{color:var(--fast-ink)}
.pe .dh{min-height:18px;padding:1px 6px;font-size:10px}
.step{display:flex;justify-content:center;padding-top:12px;border-radius:10px 10px 2px 2px;border:1px solid var(--line-soft);border-bottom:0;
 background:linear-gradient(180deg,var(--carbon-800),color-mix(in srgb,var(--carbon-900) 30%,transparent));font:700 46px/1 var(--cond);color:var(--silver)}
.ht1 .step{height:150px;border-top:3px solid var(--race-red);color:var(--white);
 background:linear-gradient(180deg,color-mix(in srgb,var(--race-red) 20%,var(--carbon-800)),color-mix(in srgb,var(--carbon-900) 30%,transparent))}
.ht2 .step{height:120px}.ht3 .step{height:100px}

/* ---------- the finishing order: one button per driver ---------- */
.sect{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;margin:28px 0 10px}
.sect h2{font:600 18px/1 var(--cond);letter-spacing:.08em;text-transform:uppercase}
.hint{font-size:13px;color:var(--silver)}
.board{list-style:none;display:flex;flex-direction:column;gap:6px}
.row{position:relative;overflow:hidden;width:100%;min-height:64px;display:grid;grid-template-columns:26px auto minmax(0,1fr) auto;align-items:center;
 column-gap:10px;padding:8px 12px 8px 10px;border-radius:12px;background:var(--carbon-900);border:1px solid var(--line-soft);text-align:left;
 -webkit-touch-callout:none;transition:transform 100ms var(--ease-out-strong)}
.row:active{transform:scale(.98);background:var(--carbon-850)}
.row.p1{background:linear-gradient(90deg,color-mix(in srgb,var(--race-red) 18%,var(--carbon-900)),var(--carbon-900) 62%);
 border-color:color-mix(in srgb,var(--race-red) 28%,var(--line-soft))}
.row.p1::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--race-red)}
.row .pos{font:700 24px/1 var(--cond);text-align:center}
.row .who{min-width:0;display:flex;flex-direction:column;gap:5px}
.row .nm{font:600 20px/1.05 var(--cond);letter-spacing:.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;line-height:1.2;color:var(--muted)}
.row .res{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .bt{font:600 22px/1 var(--cond)}
.row .gap{font:600 13px/1 var(--cond);letter-spacing:.06em;color:var(--muted)}
@media (hover:hover) and (pointer:fine){
 .row:hover{background:var(--carbon-850);border-color:var(--line)}
 .btn:hover{filter:brightness(1.06)}
}

/* ---------- actions: share or save, and the POST / STORY size beside them ---------- */
.actions{display:flex;align-items:stretch;gap:8px;margin-top:20px}
.btn{flex:1 1 auto;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 10px;border-radius:11px;
 font:700 13px/1.1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--white);background:var(--btn-face);border:1px solid var(--btn-edge);
 box-shadow:inset 0 1px 0 var(--bevel-hi),0 3px 0 var(--btn-drop);transition:transform 100ms var(--ease-out-strong)}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 var(--bevel-hi),0 0 0 var(--btn-drop)}
.btn.primary{background:var(--btn-red-face);border-color:var(--btn-red-edge);
 box-shadow:inset 0 1px 0 color-mix(in srgb,var(--white) 28%,transparent),0 3px 0 var(--btn-red-drop)}
.btn.primary:active{box-shadow:inset 0 1px 0 color-mix(in srgb,var(--white) 28%,transparent),0 0 0 var(--btn-red-drop)}
.btn[aria-busy="true"]{cursor:progress}
.btn span{white-space:nowrap}
.fmt{flex:0 0 auto;display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--ink);
 box-shadow:inset 0 2px 6px color-mix(in srgb,var(--carbon-950) 85%,transparent)}
.fmt button{min-width:46px;min-height:46px;padding:0 7px;border-radius:8px;font:800 11px/1 var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--silver)}
.fmt button[aria-pressed="true"]{background:linear-gradient(180deg,var(--plate-hi),var(--plate-lo));color:var(--plate-ink);box-shadow:inset 0 1px 0 var(--white)}
.note{display:flex;align-items:flex-start;gap:8px;margin-top:12px;font-size:14px;line-height:1.4;color:var(--silver)}
.note .ico{width:18px;height:18px;margin-top:1px;color:var(--red-ink)}

/* ---------- the footer: the TurfViz logo and the credit ---------- */
.foot{margin-top:36px;padding:22px 0 calc(26px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:center}
.brand{display:inline-flex;align-items:center;gap:12px;font:800 13px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--white)}
.brand .tvz{height:1.4em;height:round(1.4em,1px);width:auto;display:block} /* a whole px: it draws square */

/* ---------- one driver's lap card: a full-screen sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;overflow-y:auto;overscroll-behavior:contain;
 background:radial-gradient(140% 50% at 50% 0%,var(--carbon-800) 0%,var(--carbon-950) 62%) no-repeat,var(--carbon-950);
 transform:translateY(100%);transition:transform 320ms var(--ease-drawer)}
.sheet.open{transform:none}
.back{display:inline-flex;align-items:center;gap:6px;min-width:44px;min-height:44px;margin-left:-8px;padding:0 12px 0 8px;border-radius:10px;
 font:800 13px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--white)}
.sbar .sd{min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{position:relative;overflow:hidden;margin-top:16px;border-radius:18px;border:1px solid var(--line);padding:22px 20px 20px;
 background:linear-gradient(160deg,var(--carbon-800) 0%,var(--carbon-900) 60%);box-shadow:0 14px 32px -16px var(--shadow-soft);container-type:inline-size}
.card>.wm{right:-90px;top:-20px;width:390px;opacity:.12}
.card>:not(.wm){position:relative}
.card .big{display:flex;flex-direction:column;font:700 72px/.9 var(--cond);text-transform:uppercase}
.card .cn{margin-top:6px;font-size:clamp(28px,calc(100cqi / (var(--w,8) * .5)),56px);line-height:.98;letter-spacing:.01em;overflow-wrap:anywhere;text-wrap:balance}
.card .sub2{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:16px}
.card .lp{font:700 14px/1 var(--ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--silver)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.stats dt{margin-bottom:7px;font:700 12px/1 var(--ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--muted)}
.stats b{font:600 34px/1 var(--cond)}
.sheet .actions{margin-bottom:calc(28px + env(safe-area-inset-bottom))}

/* ---------- a link that holds no result we can show ---------- */
.err{position:relative;overflow:hidden;margin-top:24px;border-radius:18px;border:1px solid var(--carbon-750);padding:26px 22px 28px;
 background:linear-gradient(160deg,var(--carbon-800) 0%,var(--carbon-900) 60%)}
.err .wm{right:-90px;bottom:-50px;width:300px;opacity:.1}
.err h1{position:relative;font:700 24px/1.2 var(--ui);text-wrap:balance}
.err p{position:relative;max-width:34ch;margin-top:10px;font-size:16px;line-height:1.5;color:var(--silver);text-wrap:balance}

/* ---------- ?showcard=: the share image on screen ---------- */
.art{display:block;width:100%;height:auto;margin-top:16px;border-radius:14px;box-shadow:0 14px 32px -16px var(--shadow-soft)}

/* ---------- the entrance, once, over by 1.75 s; every value is already in place underneath ---------- */
html.intro .top{animation:kv-in 200ms ease-out backwards}
html.intro .hero{animation:kv-rise 450ms cubic-bezier(.2,.8,.2,1) 100ms backwards}
html.intro .podium li{animation:kv-rise 420ms var(--ease-out-strong) backwards;animation-delay:calc(450ms + var(--d,0) * 90ms)}
html.intro .sect{animation:kv-in 300ms ease-out 620ms backwards}
html.intro .board li{animation:kv-slide 280ms var(--ease-out-strong) backwards;animation-delay:calc(650ms + var(--i,0) * 35ms)}
html.intro main>.actions{animation:kv-in 300ms ease-out 950ms backwards}
@keyframes kv-in{from{opacity:0}}
@keyframes kv-rise{from{opacity:0;transform:translateY(24px)}}
@keyframes kv-slide{from{opacity:0;transform:translateX(16px)}}
/* the winner's finish (intro()), inside the card under its text. The flag: a 6 x 4 chequer (--q a square) in slices,
   its faint hem keeping the ink squares' edge on the dark card, on a pole */
.hero>.flag,.hero>.lap{position:absolute;z-index:0}
.flag b{position:absolute;top:0;height:calc(var(--q)*4);border:0 solid color-mix(in srgb,var(--silver) 45%,transparent);border-width:1.5px 0;
 background:repeating-conic-gradient(var(--ink) 0 25%,var(--white) 0 50%) 0 0/calc(var(--q)*2) calc(var(--q)*2) border-box}
.flag i+b{border-left-width:1.5px}
.flag i{position:absolute;left:100%;top:-4px;bottom:0;width:3px;border-radius:2px;background:linear-gradient(var(--white) 50%,transparent)}
.flag i::before{content:"";position:absolute;left:-2px;top:-5px;width:7px;height:7px;border-radius:50%;background:var(--silver)}
/* the lap: the watermark's circuit, brighter; the kart, a chrome face with a red edge like its plate; its trail */
.lap .wm{width:100%;height:100%;opacity:.55}
.lap i{position:absolute;left:0;top:0}
.lap i::before{content:"";position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--race-red);opacity:var(--o)}
.lap .kt::before{background:var(--silver);box-shadow:0 0 0 1.5px var(--race-red)}
@media (prefers-reduced-motion:reduce){
 *,*::before,*::after{animation:none!important;transition:none!important}
 .row:active{transform:none}
}
@supports not (backdrop-filter:blur(1px)){@supports not (-webkit-backdrop-filter:blur(1px)){.glass{background:var(--carbon-900)}}}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--carbon-900);-webkit-backdrop-filter:none;backdrop-filter:none}}
</style></head>

/* the page's own colours, read from its CSS variables (a mixed colour comes back as color(srgb ...): canvas gets rgb()) */
